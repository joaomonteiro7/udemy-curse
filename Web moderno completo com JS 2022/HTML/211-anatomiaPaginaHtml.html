<!doctype html>
<html>
  <head>
    <!-- coisas nao visiveis no head, por exemplo importar css e js -->
    <meta charset="UTF-8" />
    <!-- para o sistema saber o tipo de caracteres que estamos a usar -->
    <title>anatomia html</title>
  </head>
  <body>
    <header>
      <h1>Html</h1>
    </header>
    <nav>
      <a href="/">
        <!-- onde fica o menu de navegacao seja lateral ou no topo da pagina -->
        navegacao
      </a>
    </nav>
    <section id="conteudo">
      <!-- onde o conteudo principal fica -->
      conteudo
    </section>
    <aside>
      <!-- por ex publicidade de lado, ou algo que queiramos -->
      lateral
    </aside>
    <footer>
      <!-- logo do site/empresa, e outras informacoes como contactos etc -->
      rodape
    </footer>
  </body>
</html>
