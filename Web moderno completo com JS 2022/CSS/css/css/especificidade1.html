<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Especificidade CSS</title>
    <style>
      /* https://developer.mozilla.org/pt-BR/docs/Web/CSS/Specificity */
      /* 
        em linhas gerais...
        1- regras com !important
        2- selectores mais especificos
        3- ultima regra processada 
        */

      p {
        background-color: #aaa;
      }

      .observacao {
        background-color: #123;
        padding: 200px !important;
      }

      p.observacao {
        background-color: rgb(253, 7, 7);
        padding: 20px;
      }
    </style>
  </head>

  <body>
    <p class="observacao">Olha essa observação!!!!</p>
  </body>
</html>
