<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Texto</title>
    <link
      href="https://fonts.googleapis.com/css?family=Indie+Flower"
      rel="stylesheet"
    />
    <style>
      /* ... */
      * {
        margin: 0;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      html {
        font-size: 28px;
      }

      div {
        font-size: 50px;
      }

      p {
        /* valores padroes */
        font-size: 1em;
        font-size: 100%;
        font-size: 16px;
        font-size: 12pt;

        /* unidades absolutas */
        font-size: 100px; /* px é tamanho relativo */
        font-size: 72pt;
        font-size: 1in;

        /* unidades relativas */
        font-size: 2.2em; /* em -> usa a referencia mais proxima, depende se ta dentro de algum elemento ou nao */
        font-size: 2.2rem; /* rem -> usa referencia a fonte do html base */
        font-size: 50vh;
        font-size: 10vw;

        font-family: monospace;
        font-family: georgia, serif;
        font-family: verdana, sans-serif;
        font-family: "indie flower", cursive;

        font-weight: 900;
        font-style: italic;
        text-transform: capitalize;
        text-decoration: line-through;
        word-spacing: 80px;
        letter-spacing: 20px;
        line-height: 2.5em;
        text-align: right;
      }

      .botao {
        font-size: 28px;
        text-decoration: none;
        padding: 10px 30px;
        border-radius: 25px;
      }

      .destaque {
        color: white;
        background-color: red;
        box-shadow: 2px 2px 1px 1px #000;
      }

      .destaque:active {
        box-shadow: none;
      }
    </style>
  </head>

  <body>
    <div>
      <p>
        Que texto
        <br />legal!!!
      </p>
    </div>
    <a href="http://google.com" class="botao destaque">Google</a>
  </body>
</html>
