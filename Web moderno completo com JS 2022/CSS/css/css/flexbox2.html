<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Flexbox #02</title>
    <link rel="stylesheet" href="css/tag.css" />
    <style>
      /* ... */
      div {
        border: solid 5px dodgerblue;
        font-size: 40px;
      }

      .flex-container div {
        box-sizing: border-box;
      }

      .flex-container {
        display: flex;
        height: 300px;
        width: 600px;
      }

      .flex-container div:nth-child(3) {
        background-color: indianred;
        order: 0; /* quanto maior a ordem, o elementos fica em "ultimo"*/
        order: 1;
        order: -1; /* quanto menor a ordem, o elemnto fica em "primeiro" */
        align-self: center;
        align-self: flex-end;
        align-self: flex-start;
      }

      .flex-container div {
        width: 100px;
        flex-grow: 0; /* fica igual para todos */
        flex-grow: 1; /* todos crescem e ficam iguais */
      }

      .flex-container div:nth-child(1) {
        /* e o primeiro elemento definidos na div e nao visualmente */
        flex-grow: 2; /* o primeiro elementos fica maior que os outros */
      }

      .flex-container {
        width: 300px;
        flex-shrink: 1;
      }

      .flex-container div:nth-child(1) {
        flex-shrink: 5;
      }
    </style>
  </head>

  <body>
    <div class="flex-container tag nolabel">
      <div class="tag nolabel">1</div>
      <div class="tag nolabel">2</div>
      <div class="tag nolabel">3</div>
      <div class="tag nolabel">4</div>
    </div>
    <script src="js/tag.js"></script>
  </body>
</html>
