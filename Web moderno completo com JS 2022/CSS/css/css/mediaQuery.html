<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Media Query</title>
    <style>
      div {
        font-size: 40px;
        margin: 20px;
        padding: 20px;
        background-color: coral;
        border: solid 5px;
        display: none;
      }

      @media (max-width: 600px) {
        .muitoPequeno {
          display: block;
        }
      }

      @media (max-width: 1000px), (orientation: portrait) {
        .pequenoRetrato {
          display: block;
        }
      }

      @media (min-width: 500px) and (max-width: 1000px) {
        .intervalo {
          display: block;
        }
      }
    </style>
  </head>
  <body>
    <div class="muitoPequeno">Muito Pequeno</div>
    <div class="pequenoRetrato">Pequeno ou Retrato</div>
    <div class="intervalo">Intervalo</div>
  </body>
</html>
